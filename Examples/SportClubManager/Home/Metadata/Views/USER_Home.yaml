DisplayLabel: %Config:AppTitle%
Controller: BorderPanel
  .NorthView:
    Controller: ToolBar
      TreeView: %Auth:PROFILEID%_TopMenu

  WestView:
    Controller: BorderPanel
      Width: 440
      Collapsible: True
      Border: True
      Split: True
      Header: True
      Height: 60
      NorthView:
        Controller: HtmlPanel
          Split: False
          Html: <img src="%IMAGE(%Config:SportsClubLogo%)%" style="width: 100%; height: auto; display: block">
      CenterView:
        Controller: TilePanel
          .Style: background-image: url("%IMAGE(%Config:SportsClubLogo%)%")
          ColorSet: Blue
          Border: True
          Split: True
          Header: True
          TileHeight: 80
          TileWidth: 100
          BorderColor: #e18325
          ShowImage: True
          TreeView: %Auth:PROFILEID%_TreeMenu
      # User-selectable theme switcher (Light / Auto / Dark) docked at the
      # bottom of the menu. Renders only when Theme: Auto / UserSelection: True.
      SouthView:
        Height: 44
        Controller: BorderPanel
          Border: False
          Header: False
          Split: False
          WestView:
            Width: 112
            Controller: ThemeSwitcher
          CenterView:
            Controller: LanguageSwitcher

  CenterView:
    #Panel with tabs hosting the views
    Controller: TabPanel
      Border: True
      # List of views to be auto-opened in tabs: remove dot and
      .SubViews:
        View: USER_People

  SouthView:
    #Status bar with the user name and the app version.
    Controller: StatusBar
      Text: %Auth:User_FullName% | <a target="_blank" href="https://sportclubmanager.it/docs/scm/contents" style="color:orange; font-size: medium">_(Need help?)</a>
    ImageName: user
MobileSettings:
  Content:
    Width: 480
    User-scalable: 0
  ContentLandscape:
    Width: 1000
    User-scalable: 0
