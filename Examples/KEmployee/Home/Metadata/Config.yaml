AppName: KEmployeeX
AppTitle: Employee demo
AppIcon: FireBirdSql_120
# Default is the application name in lower case.
AppPath: /kemployeex
Application:
  # When using partial proxy mode (serving /hellokitto/res/ from a separate web server)
  # you can set this to False to gain some speed. Default is True.
  #HandleResources: False

# Defaults for entire application
Defaults:
  Grid:
    PageRecordCount: 100
    DefaultAction: Edit
  FormPanel:
    HideLabels: False
  Window:
    Width: 900
    Height: 500
  Layout:
    MemoWidth: 70
    MaxFieldWidth: 70
    MinFieldWidth: 6

Databases:
  Main: FD
    Connection:
      # Example for FireDAC
      DriverID: FB
      Database: EMPLOYEE
      User_Name: SYSDBA
      Password: masterkey
      Server: localhost
      #CharacterSet: UTF8
      Protocol: TCPIP

  DBExpress: DBX
    Connection:
      # Example for DbExpress
      DriverName: Firebird
      DataBase: localhost:EMPLOYEE
      User_Name: SYSDBA
      Password: masterkey
      #ServerCharSet: UTF8
      WaitOnLocks: True
      IsolationLevel: ReadCommitted
      Trim Char: False

Auth: LDAP
  # The credential check is delegated to the LDAP authenticator (registered by
  # Kitto.Auth.LDAP), which validates the user against Active Directory with a
  # simple bind (native wldap32 API). The optional JWT: block below turns on the
  # self-contained token envelope: on success the Kitto.Auth.JWT engine
  # builds/signs a JWT, sets the kx_token HttpOnly cookie and validates it on
  # every subsequent request via the auth request-filter.
  # ============================================================
  # DEMO CONFIG - public test LDAP server (no Windows domain needed).
  # Log in with just the short name, e.g.:   tesla / password
  # Other users: einstein, newton, galieleo (all password "password").
  # ============================================================
  Host: ldap.forumsys.com
  Port: 389
  UseSSL: False
  # Generic (non-AD) LDAP: build the full bind DN from the short user name,
  # so the user types only "tesla" instead of the whole DN.
  BindDNTemplate: uid=%s,dc=example,dc=com
  # Read the user's display attributes after the bind.
  SearchBase: dc=example,dc=com
  SearchFilter: (uid=%s)
  Attributes:
    Email: mail
    FullName: cn
    LastName: sn
  #
  # --- PRODUCTION Active Directory example (uncomment and edit) ---
  # Host: dc01.corp.local
  # Port: 389
  # UseSSL: False
  # DefaultDomain: CORP
  # SearchBase: DC=corp,DC=local
  # SearchFilter: (sAMAccountName=%s)
  # Attributes:
  #   Email: mail
  #   FirstName: givenName
  #   LastName: sn
  #   FullName: displayName
  #   Groups: memberOf

  # Optional JWT envelope. Present = issue/validate a JWT (the engine is added
  # by the Kitto.Auth.JWT unit referenced from UseKitto.pas).
  JWT:
    # SigningAlgorithm: HS256/HS384/HS512 (HMAC, no OpenSSL DLL required from
    # Delphi 10 Seattle onward) or RS256/RS384/RS512/ES256/ES384/ES512 (asymmetric,
    # require OpenSSL libraries to be deployed alongside the binary).
    SigningAlgorithm: HS256
    # SigningKey accepts:
    #   env:VAR_NAME    read from environment variable (recommended for prod)
    #   file:/path      read raw bytes from a file (PEM for RS*/ES*)
    #   inline literal  any other value, used as the raw key (DEV ONLY)
    # The KEmployeeX demo overrides this via TKJWTSigningKeyRegistry in
    # UseKitto.pas — the registered provider always takes precedence over
    # this YAML setting. The env var fallback is kept here so that removing
    # the provider from UseKitto.pas keeps the app running without code
    # changes (just set KX_JWT_KEY_KEMPLOYEE).
    SigningKey: env:KX_JWT_KEY_KEMPLOYEE
    # iss/aud claims — verified on every request validation.
    Issuer: KEmployeeX
    Audience: kx-app
    # exp claim relative to issue time, in seconds.
    TokenLifetime: 3600
    # When (exp - now) drops below SlidingThreshold seconds, the auth gate
    # re-issues the cookie with a fresh exp. Set to 0 to disable sliding.
    SlidingThreshold: 600
    # Allowance (seconds) for clock skew between client and server during
    # exp/nbf/iat validation.
    ClockSkew: 60
    Claims:
      IncludeRoles: False
      # IncludeDB left False because KEmployee uses a single Main database.
      IncludeDB: False
      IncludeDisplayName: True
      IncludeLanguage: True
  .Defaults:
    UserName: tesla
    Password: password
      # The kx_acl claim is included automatically only when AccessControl
      # below is set to JWT. KEmployee uses AccessControl: Null so the
      # claim is omitted by the framework.

AccessControl: Null

Login:
  Controller:
    Title: %Config:AppTitle% %APP_VERSION_FULL%
    BorderPanel:
      NorthView:
        Controller: HtmlPanel
          Html: |
            <div style="text-align: center">
              <p/>
              <p><img src="%IMAGE(Firebird_Employee)%"></img></p>
              <p><H1>Firebird Employee Demo</H1></p>
              <p/>
            </div>
      # User-selectable theme switcher under the form (Light / Auto / Dark).
      # Renders only when Theme: Auto / UserSelection: True; otherwise no-op.
      SouthView:
        Controller: ThemeSwitcher
    ExtraWidth: 400
    LabelWidth: 150
    ExtraHeight: 210
    LocalStorage:
      Mode: Password
      AskUser: True
        .Default: False

# Change this to use a custom view for the home page.
# Alternatively, customize the Home view by replacing its controller.
# Default: Home.
#HomeView: Home

# UserSelection: True shows the ThemeSwitcher (only honoured when Mode=Auto);
# the choice is persisted per-app in localStorage (kx_theme:KEmployeeX).
# No Primary-Color → neutral slate palette in both light and dark.
Theme:
  Mode: Auto
  UserSelection: True
  IconStyle: outlined

AjaxTimeout: 100000

# No language Id specified means try to use the language requested by the browser.
LanguageId: en
LanguagePerSession: True
# Either utf-8 or a SBCS corresponding to the system code page
# (such as iso-8859-1 for Western Europe). Defaults to utf-8.
Charset: utf-8
UserFormats:
  Date: mm/dd/yyyy
  Time: hh:nn

Log:
  # low, medium, high, detailed, debug
  Level: detailed
  TextFile:
    FileName: %APP_PATH%log.txt
    # Set this to false to disable this logger without deleting its configuration.
    IsEnabled: True

Server:
  Port: 3623
  # default 20
  ThreadPoolSize: 15

# Help chat assistant (bubble, bottom-right). The 'docsearch' provider answers
# from the bundled KittoX documentation index, linking to ethea.it/docs/kittox.
HelpChat:
  Enabled: True
  # 'docsearch' answers from the bundled documentation index (no key, no network).
  # 'claude' streams answers from Anthropic's Claude, grounded on the same index
  # (RAG). To use Claude switch the provider and set the API key below (or the
  # ANTHROPIC_API_KEY environment variable). Keep the real key out of the public
  # repo, exactly as for GoogleMapsApiKey.
  Provider: claude
  Claude:
    ApiKey: sk-ant-api03-XYZ
    Model: claude-haiku-4-5
    MaxTokens: 1024
    GroundingMaxPages: 3

Engine:
  Session:
    # Minutes after which an inactive session is cleaned up. Defaults to 10.
    TimeOut: 10
    # Seconds after wich the cleanup of inactive sessions kicks in. Defaults to 30.
    CleanupInterval: 30
