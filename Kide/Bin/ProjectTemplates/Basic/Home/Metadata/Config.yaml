AppTitle: {AppTitle}

# Default database connection name. Empty until a Databases entry is added.
DefaultDatabaseName: Main

Databases:

Auth: Null

AccessControl: Null

# Theme. Mode = Auto (follow OS) | Light | Dark.
# IconStyle = filled | outlined | round | sharp | two-tone.
# IconSize = Small | Medium | Large.
# UserSelection: True shows a ThemeSwitcher (only when Mode=Auto); the choice
# is persisted per-app in the browser localStorage.
# Add Light:/Dark: sub-nodes with a Primary-Color to colour each mode; with no
# Primary-Color the framework's neutral slate palette is used.
Theme:
  Mode: Auto
  UserSelection: True
  IconStyle: outlined
  IconSize: Medium
  #Light:
  #  Primary-Color: SteelBlue
  #Dark:
  #  Primary-Color: SteelBlue

# Default UI language. The runtime can switch language per session via
# the Accept-Language header or the kx_lang cookie.
LanguageId: en

# Either utf-8 or a SBCS corresponding to the system code page
# (such as iso-8859-1 for Western Europe). Defaults to utf-8.
Charset: utf-8

# AJAX timeout in milliseconds for HTMX and fetch channels (passed verbatim
# to htmx.config.timeout and to the fetch wrapper in kxgrid.js). Applies to
# long requests (e.g. heavy queries, exports). Default: 100000 (100 s).
AjaxTimeout: 100000

# Initial UI: Home view + main menu. The Basic template ships a minimal
# tree menu containing Logout and ChangePassword (under Views/MainMenu).
# Add views auto-generated from your Models with `kx menu_generate_main_menu`
# (MCP-KittoX) or by hand in Views/MainMenu.yaml.
HomeView: Home

Server:
  # Which HTTP stack serves this application when it runs on its own:
  #   indy    - the one KittoX has always had; works everywhere, no privileges
  #   httpsys - the kernel-mode stack of Windows (the one IIS sits on): TLS
  #             bound with netsh from the certificate store, several processes
  #             sharing one port, requests queued while the application
  #             restarts. A URL other than localhost needs a reservation
  #             (netsh http add urlacl).
  # It can be changed at any time, with no rebuild. The Desktop executable
  # always uses Indy; under IIS and Apache this whole node is ignored.
  Engine: indy
  Port: 8080
  ThreadPoolSize: 20

Engine:
  Session:
    # In minutes.
    TimeOut: 10
